input {
  file {
    path => ['/var/log/metrocrawl/*.log']
    codec => json
    tags => ['metrocrawl']
  }
}

output {
  if 'metrocrawl' in [tags]{
    elasticsearch {
      hosts => "<your es hosts here>"
      template => "/etc/logstash/templates/logs-template.json"
      template_name => "logs-*"
      template_overwrite => true
      index => "logs-metrocrawl"
      document_type => "%{[logger]}"
    }
  }
}